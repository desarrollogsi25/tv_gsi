services:
  db:
    container_name: tv-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:-${PG_PASSWORD:?Set PG_ADMIN_PASSWORD in .env}}
      POSTGRES_DB: ${PG_DATABASE:-nexus_tv}
      PG_APP_USER: ${PG_APP_USER:-nexus_app}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:-${PG_PASSWORD:?Set PG_APP_PASSWORD in .env}}
    ports:
      - "${HOST_DB_BIND:-127.0.0.1}:${HOST_DB_PORT:-25432}:5432"
    volumes:
      - tv_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_ADMIN_USER:-postgres} -d ${PG_DATABASE:-nexus_tv}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tv_network

  backend:
    container_name: tv-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_API_PORT:-23002}:3002"
    volumes:
      - ./media:/app/media
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:28080,http://127.0.0.1:28080}
      - PG_HOST=db
      - PG_PORT=5432
      - PG_APP_USER=${PG_APP_USER:-nexus_app}
      - PG_APP_PASSWORD=${PG_APP_PASSWORD:-${PG_PASSWORD:?Set PG_APP_PASSWORD in .env}}
      - PG_DATABASE=${PG_DATABASE:-nexus_tv}
      - PORT=3002
      - MEDIA_DIR=/app/media
      # AUD-007: clave HMAC de URLs firmadas; el backend falla de forma segura
      # (sin emitir ni validar firmas) si la variable está vacía.
      - MEDIA_URL_SIGNING_KEY=${MEDIA_URL_SIGNING_KEY:-}
      # AUD-006: valores seguros por defecto si .env no los define.
      - ALLOW_QUERY_DEVICE_TOKEN=${ALLOW_QUERY_DEVICE_TOKEN:-false}
      - OBSERVE_QUERY_DEVICE_TOKEN=${OBSERVE_QUERY_DEVICE_TOKEN:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tv_network

  frontend:
    container_name: tv-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_WEB_PORT:-28080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - tv_network

volumes:
  tv_pgdata:
    driver: local

networks:
  tv_network:
    driver: bridge
