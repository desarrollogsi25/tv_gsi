name: Nexus TV — CI Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-syntax:
    name: Backend Syntax & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Verify Core Syntax
        run: |
          node --check nx_tv.js
          node --check src/config/db.js
          node --check src/config/jwt.js
          node --check src/middlewares/auth.js
          node --check src/routes/auth.js
          node --check src/routes/tv.js
          node --check src/routes/admin.js
          node --check src/routes/media.js
          node --check src/sockets/index.js

      - name: Run Unit Tests
        run: npm test

  frontend-lint-and-build:
    name: Frontend Build & Oxlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Linter (oxlint)
        working-directory: ./frontend
        run: npx oxlint

      - name: Build Production Assets (Vite)
        working-directory: ./frontend
        run: npm run build

  docker-syntax-validation:
    name: Docker Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Compose File
        env:
          PG_PASSWORD: ci-validation-only
          JWT_SECRET: ci-validation-only-random-secret
        run: docker compose -f docker-compose.yml config --quiet
